<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antares – Factures</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #2e3338; --fg: #eceff1; --muted: #aab2ba; --line: #d5dae0;
    --head: #f1f3f5; --accent: #1f4e79; --hover: #f7f9fb; --focus: #ffb35c;
    --ink: #1f2933; --dark-line: #4a5157;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--fg); padding: 12px 16px;
         display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .04em; font-weight: 700; }
  h1 span { font-weight: 400; color: var(--muted); letter-spacing: 0; }
  hr { width: 100%; border: 0; border-top: 1px solid var(--dark-line); margin: 0; }
  .bar { display: flex; justify-content: space-between; gap: 8px; }
  button, select { font: inherit; color: var(--ink); background: #fff;
         border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h2 { font-size: 16px; margin: 4px 0 0; font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  .filters label { display: flex; align-items: center; gap: 8px; }
  .wrap { background: #fff; color: var(--ink); flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--head); font-weight: 600; }
  th + th, td + td { border-left: 1px solid var(--line); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th button { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  th button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.sel, tbody tr.sel:hover { background: #ffe3bf; color: #1f2933; }
  tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .empty { padding: 24px; text-align: center; color: #6b7785; }
  #msg { color: var(--muted); font-size: 12px; }
  /* Fenêtre détail facture */
  #overlay, #ov-loc { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
             align-items: center; justify-content: center; padding: 16px; }
  #overlay.open, #ov-loc.open { display: flex; }
  #dlg, #dlg-loc { background: var(--bg); color: var(--fg); border: 1px solid var(--dark-line); border-radius: 6px;
         width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  #dlg-loc { width: min(1250px, 100%); }
  #dlg header, #dlg-loc header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #dlg h3, #dlg-loc h3 { margin: 0; font-size: 18px; }
  #dlg .wrap, #dlg-loc .wrap { flex: 0 1 auto; }
  #dlg-loc .wrap { overflow: auto; }
  #dlg-loc th, #dlg-loc td { white-space: nowrap; }
  .switch { display: inline-block; width: 34px; height: 18px; border-radius: 9px; background: #b8c0c8; position: relative; vertical-align: middle; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  td.ctr, th.ctr { text-align: center; }
  #dlg tfoot td { font-weight: 600; background: var(--head); }
  #dlg tfoot td:first-child { text-align: right; }
  #dlg tfoot tr:first-child td { border-top: 2px solid var(--line); }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  button.orange { background: #ffcf9e; border-color: #ffcf9e; color: var(--ink); font-weight: 600; }
  button.orange:hover { background: #ffc28a; border-color: #ffc28a; color: var(--ink); }
  button.orange:disabled { opacity: .45; cursor: not-allowed; }
  #ov-form, #ov-new { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 16px; }
  #ov-form.open, #ov-new.open { display: flex; }
  #dlg-form, #dlg-new { background: var(--bg); color: var(--fg); border: 1px solid var(--dark-line); border-radius: 6px;
              width: min(640px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  #dlg-form header, #dlg-new header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #dlg-form h3, #dlg-new h3 { margin: 0; font-size: 18px; }
  #form-grid, #new-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  #form-grid label, #new-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  #form-grid .full { grid-column: 1 / -1; }
  #form-grid input, #form-grid select, #new-grid input, #new-grid select { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; width: 100%; }
  #form-grid input.num { text-align: right; }
  #form-grid input[readonly], #new-grid input[readonly] { background: #e3e6e9; color: #6b7785; font-weight: 700; }
  button.switch { padding: 0; border: 0; width: 34px; height: 18px; border-radius: 9px; background: #b8c0c8; }
  #dlg-form .switch.on { background: #ffb35c; }
  #dlg-new { width: min(760px, 100%); }
  #new-grid { grid-template-columns: repeat(4, 1fr); }
  #dlg-new .wrap { flex: 0 1 auto; overflow: auto; }
  #new-rows td { padding: 4px 8px; }
  #new-rows td.ro { color: #6b7785; white-space: nowrap; }
  #new-rows input { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; width: 100%; }
  #new-rows input.num { text-align: right; min-width: 90px; }
  #new-rows button { padding: 2px 8px; }
  #new-msg { color: #ffb3a7; font-size: 12px; min-height: 1em; }
  @media (max-width: 640px) { #new-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { #form-grid { grid-template-columns: 1fr; } }
  #form-msg { color: #ffb3a7; font-size: 12px; min-height: 1em; }
  #dlg-msg, #loc-msg { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1>ANTARES <span>– Factures</span></h1>
  <hr>
  <div class="bar">
    <button id="btnNew" type="button">Nouvelle facture</button>
    <button id="btnLocaux" type="button">Locaux</button>
  </div>
  <hr>
  <h2>Liste des factures</h2>
  <div class="filters">
    <label>Référence <select id="ref"></select></label>
    <label>Année <select id="year"></select></label>
    <label>Mois <select id="month"></select></label>
    <span id="msg"></span>
  </div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>Réf.</th>
        <th aria-sort="descending"><button id="sort" type="button" title="Inverser le tri">Date <span id="arrow">▼</span></button></th>
        <th>N° Facture</th>
        <th class="num">Montant</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

<div id="overlay"><div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <header><h3 id="dlg-title"></h3><button id="dlg-close" type="button" aria-label="Fermer">Fermer</button></header>
  <div class="wrap"><table>
    <thead><tr><th>Description</th><th class="num">Montant</th></tr></thead>
    <tbody id="dlg-rows"></tbody>
    <tfoot id="dlg-foot"></tfoot>
  </table></div>
  <div id="dlg-msg"></div>
</div></div>

<div id="ov-loc"><div id="dlg-loc" role="dialog" aria-modal="true" aria-labelledby="loc-title">
  <header><h3 id="loc-title">Locaux</h3><button id="loc-close" type="button" aria-label="Fermer">Fermer</button></header>
  <div class="wrap"><table>
    <thead><tr>
      <th>Réf.</th><th>Nom commercial</th><th>Adresse</th><th>Code postal</th><th>Ville</th>
      <th>Loyer</th><th class="num">Provision TF</th><th class="num">Provision charges</th><th class="num">Montant HT</th>
      <th class="ctr">TVA</th><th class="num">Taux TVA</th><th>Date bail</th>
    </tr></thead>
    <tbody id="loc-rows"></tbody>
  </table></div>
  <div class="actions"><span id="loc-msg"></span><button id="loc-edit" class="orange" type="button" disabled title="Sélectionnez d'abord un local">Modifier</button></div>
</div></div>

<div id="ov-form"><div id="dlg-form" role="dialog" aria-modal="true" aria-labelledby="form-title">
  <header><h3 id="form-title"></h3></header>
  <div id="form-grid"></div>
  <div id="form-msg" role="alert"></div>
  <div class="actions"><button id="form-cancel" type="button">Annuler</button><button id="form-save" class="orange" type="button">Enregistrer</button></div>
</div></div>

<div id="ov-new"><div id="dlg-new" role="dialog" aria-modal="true" aria-labelledby="new-title">
  <header><h3 id="new-title">Nouvelle facture</h3></header>
  <div id="new-grid">
    <label>REF<select id="n_ref"></select></label>
    <label>Date facture<input id="n_date" type="date"></label>
    <label>N°<input id="n_num" class="num" type="number" step="1" min="0"></label>
    <label>Facture<input id="n_fact" type="text" readonly tabindex="-1"></label>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>REF</th><th>Num Facture</th><th>Description</th><th class="num">Montant</th><th></th></tr></thead>
    <tbody id="new-rows"></tbody>
  </table></div>
  <div class="actions"><button id="new-add" type="button">Ajouter une ligne</button><span id="new-msg" role="alert"></span></div>
  <div class="actions"><button id="new-cancel" type="button">Annuler</button><button id="new-save" class="orange" type="button">Enregistrer</button></div>
</div></div>

<script>
const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août",
              "Septembre","Octobre","Novembre","Décembre"];
const $ = id => document.getElementById(id);
const euro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const fmtDate = new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC" });

let data = [];          // [{id, ref, d, num, montant}]
let desc = true;        // tri date : décroissant par défaut
let selectedId = null;  // ligne sélectionnée

// --- Boutons : à configurer plus tard (ouvrir une page, lancer une action...) ---



// Lecture directe de la table FACTURES : $REF, $Date_Facture, $Num_Facture, $Montant_TTC
// accès "full" nécessaire pour lire aussi la table Lignes_de_facture
grist.ready({ requiredAccess: "full" });

let refMap = new Map();   // id Locaux -> REF (si Factures.REF est une colonne Référence)
async function loadRefMap() {
  try { const t = await grist.docApi.fetchTable("Locaux"); refMap = new Map(t.id.map((id, i) => [id, t.REF[i]])); } catch (e) {}
}
grist.onRecords(async records => {
  if (records.some(r => typeof r.REF === "number")) await loadRefMap();
  data = records.map(r => {
    let d = null;
    const v = r.Date_Facture;
    if (typeof v === "number") d = new Date(v * 1000);
    else if (v) { const t = new Date(v); if (!isNaN(t)) d = t; }
    return { id: r.id, refRaw: r.REF, ref: refMap.get(r.REF) ?? r.REF ?? "", n: Number(r.Num) || 0, d, num: r.Num_Facture ?? "", montant: Number(r.Montant_TTC) || 0,
             ht: Number(r.Montant_HT) || 0, tva: !!r.TVA };
  });
  refreshSelect("ref", [...new Set(data.map(r => String(r.ref)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr", { numeric: true })), "Toutes");
  refreshSelect("year", [...new Set(data.filter(r => r.d).map(r => r.d.getUTCFullYear()))].sort((a, b) => b - a).map(String), "Toutes");
  render();
});

function refreshSelect(id, values, allLabel) {
  const sel = $(id), keep = sel.value;
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option>${v}</option>`).join("");
  if (values.includes(keep)) sel.value = keep;
}

$("month").innerHTML = '<option value="">Tous</option>' + MOIS.map((n, i) => `<option value="${i}">${n}</option>`).join("");
$("ref").onchange = $("year").onchange = $("month").onchange = render;
$("sort").onclick = () => { desc = !desc; render(); };

function select(id) {
  selectedId = (selectedId === id) ? null : id;   // un second clic désélectionne
  document.querySelectorAll("#rows tr[data-id]").forEach(tr => tr.classList.toggle("sel", +tr.dataset.id === selectedId));
  if (selectedId !== null) { try { grist.setCursorPos({ rowId: selectedId }); } catch (e) {} }
}

$("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-id]"); if (tr) select(+tr.dataset.id);
});
$("rows").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("tr[data-id]"); if (tr) { e.preventDefault(); select(+tr.dataset.id); }
});

// ---------- Fenêtre détail ----------
const TABLE_LIGNES = "Lignes_de_facture";
// Colonne de Lignes_de_facture qui pointe vers la facture
const COLONNE_LIEN = "Num_Facture";
const LIENS_POSSIBLES = ["Facture","Factures","REF","Ref","Facture_ID","ID_Facture","Id_Facture","Num_Facture"];
const esc2 = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lastFocus = null;

async function openInvoice(id) {
  const inv = data.find(r => r.id === id); if (!inv) return;
  lastFocus = document.activeElement;
  $("dlg-title").textContent = `${inv.ref} – ${inv.num}`;
  $("dlg-rows").innerHTML = ""; $("dlg-foot").innerHTML = ""; $("dlg-msg").textContent = "Chargement…";
  $("overlay").classList.add("open"); $("dlg-close").focus();
  try {
    const t = await grist.docApi.fetchTable(TABLE_LIGNES);
    const cols = Object.keys(t).filter(k => !["id", "manualSort"].includes(k) && !k.startsWith("gristHelper_"));
    const link = COLONNE_LIEN || LIENS_POSSIBLES.find(c => cols.includes(c));
    if (!link) throw new Error(`Colonne de lien introuvable dans ${TABLE_LIGNES} (colonnes : ${cols.join(", ")}). Renseignez COLONNE_LIEN.`);
    const match = v => v === id || String(v) === String(inv.num);
    const lines = [];
    t.id.forEach((_, i) => { if (match(t[link][i])) lines.push({ d: t.Description[i] ?? "", m: Number(t.Montant[i]) || 0 }); });
    const total = lines.reduce((a, l) => a + l.m, 0);
    $("dlg-rows").innerHTML = lines.length
      ? lines.map(l => `<tr><td>${esc2(l.d)}</td><td class="num">${euro.format(l.m)}</td></tr>`).join("")
      : '<tr><td colspan="2" class="empty">Aucune ligne pour cette facture.</td></tr>';
    const row = (label, v) => `<tr><td>${label}</td><td class="num">${euro.format(v)}</td></tr>`;
    $("dlg-foot").innerHTML = inv.tva
      ? row("Total HT", total) + row("TVA", inv.montant - inv.ht) + row("Total TTC", inv.montant)
      : row("Total", total);
    $("dlg-msg").textContent = "";
  } catch (e) { $("dlg-msg").textContent = "Erreur : " + (e.message || e); }
}
function closeInvoice() {
  $("overlay").classList.remove("open");
  if (lastFocus) lastFocus.focus();
}
$("dlg-close").onclick = closeInvoice;
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeInvoice(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("overlay").classList.contains("open")) closeInvoice(); });
$("rows").addEventListener("dblclick", e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  const id = +tr.dataset.id;
  if (selectedId !== id) select(id);
  openInvoice(id);
});

// ---------- Fenêtre Locaux ----------
const pct = new Intl.NumberFormat("fr-FR", { style: "percent", maximumFractionDigits: 2 });
const CHAMPS = [
  { k: "REF", l: "Réf.", t: "ro" },
  { k: "Nom_Commercial", l: "Nom commercial", t: "text" },
  { k: "Adresse", l: "Adresse", t: "text", full: true },
  { k: "Code_postal", l: "Code postal", t: "text", num: true },
  { k: "Ville", l: "Ville", t: "text" },
  { k: "Montant_loyer", l: "Loyer (€)", t: "eur" },
  { k: "Provision_TF", l: "Provision TF (€)", t: "eur" },
  { k: "Provision_charges", l: "Provision charges (€)", t: "eur" },
  { k: "Montant_HT", l: "Montant HT (€) – calculé", t: "calc" },
  { k: "TVA", l: "TVA", t: "bool" },
  { k: "Taux_TVA", l: "Taux TVA (%)", t: "pct" },
  { k: "Date_bail", l: "Date bail", t: "date" }
];
let locT = null, locSel = null, locFocus = null, formFocus = null;

async function loadLocaux() {
  try {
    locT = await grist.docApi.fetchTable("Locaux");
    renderLoc();
    $("loc-msg").textContent = "";
  } catch (e) { $("loc-msg").textContent = "Erreur : " + (e.message || e); }
}
function renderLoc() {
  const t = locT, col = (k, i) => (t[k] ? t[k][i] : undefined);
  const txt = v => esc2(v ?? "");
  const eur = v => (v === null || v === undefined || v === "") ? "" : euro.format(Number(v) || 0);
  const date = v => typeof v === "number" ? fmtDate.format(new Date(v * 1000)) : "";
  const idx = t.id.map((_, i) => i).sort((a, b) =>
    String(col("REF", a) ?? "").localeCompare(String(col("REF", b) ?? ""), "fr", { numeric: true }));
  if (!t.id.includes(locSel)) locSel = null;
  $("loc-rows").innerHTML = idx.length ? idx.map(i => {
    const tva = !!col("TVA", i), tx = col("Taux_TVA", i), id = t.id[i];
    return `<tr data-id="${id}" tabindex="0" class="${id === locSel ? "sel" : ""}"><td>${txt(col("REF", i))}</td><td>${txt(col("Nom_Commercial", i))}</td><td>${txt(col("Adresse", i))}</td>
      <td class="num">${txt(col("Code_postal", i))}</td><td>${txt(col("Ville", i))}</td>
      <td class="num">${eur(col("Montant_loyer", i))}</td><td class="num">${eur(col("Provision_TF", i))}</td>
      <td class="num">${eur(col("Provision_charges", i))}</td><td class="num">${eur(col("Montant_HT", i))}</td>
      <td class="ctr"><span class="switch${tva ? " on" : ""}" role="switch" aria-checked="${tva}" aria-label="TVA"></span></td>
      <td class="num">${typeof tx === "number" ? pct.format(tx) : ""}</td><td>${date(col("Date_bail", i))}</td></tr>`;
  }).join("") : '<tr><td colspan="12" class="empty">Aucun local.</td></tr>';
  $("loc-edit").disabled = locSel === null;
}
function selectLoc(id) {
  locSel = (locSel === id) ? null : id;
  document.querySelectorAll("#loc-rows tr[data-id]").forEach(tr => tr.classList.toggle("sel", +tr.dataset.id === locSel));
  $("loc-edit").disabled = locSel === null;
}
async function openLocaux() {
  locFocus = document.activeElement;
  $("loc-rows").innerHTML = ""; $("loc-msg").textContent = "Chargement…";
  $("ov-loc").classList.add("open"); $("loc-close").focus();
  await loadLocaux();
}
function closeLocaux() { $("ov-loc").classList.remove("open"); if (locFocus) locFocus.focus(); }
$("btnLocaux").onclick = openLocaux;
$("loc-close").onclick = closeLocaux;
$("ov-loc").addEventListener("click", e => { if (e.target === $("ov-loc")) closeLocaux(); });
$("loc-rows").addEventListener("click", e => { const tr = e.target.closest("tr[data-id]"); if (tr) selectLoc(+tr.dataset.id); });
$("loc-rows").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("tr[data-id]"); if (tr) { e.preventDefault(); selectLoc(+tr.dataset.id); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("ov-loc").classList.contains("open") && !$("ov-form").classList.contains("open")) closeLocaux();
});

// ---------- Formulaire de modification ----------
function openForm() {
  if (locSel === null || !locT) return;
  const i = locT.id.indexOf(locSel); if (i < 0) return;
  formFocus = document.activeElement;
  $("form-title").textContent = "Modifier le local – " + (locT.REF?.[i] ?? "");
  $("form-msg").textContent = "";
  $("form-grid").innerHTML = CHAMPS.map(c => {
    const v = locT[c.k]?.[i], id = "f_" + c.k, cls = c.full ? "full" : "";
    if (c.t === "bool")
      return `<label class="${cls}">${c.l}<button type="button" id="${id}" class="switch${v ? " on" : ""}" role="switch" aria-checked="${!!v}" aria-label="${c.l}"></button></label>`;
    let type = "text", val = v ?? "", extra = "", ic = c.num ? "num" : "";
    if (c.t === "eur") { type = "number"; extra = ' step="0.01"'; ic = "num"; }
    if (c.t === "pct") { type = "number"; extra = ' step="0.01"'; ic = "num"; val = typeof v === "number" ? Math.round(v * 10000) / 100 : ""; }
    if (c.t === "date") { type = "date"; val = typeof v === "number" ? new Date(v * 1000).toISOString().slice(0, 10) : ""; }
    if (c.t === "calc") { type = "number"; extra = ' step="0.01"'; ic = "num"; }
    if (c.t === "ro" || c.t === "calc") extra += " readonly tabindex=\"-1\"";
    return `<label class="${cls}">${c.l}<input id="${id}" class="${ic}" type="${type}"${extra} value="${esc2(val)}"></label>`;
  }).join("");
  $("ov-form").classList.add("open");
  const first = $("form-grid").querySelector("input:not([readonly])"); if (first) first.focus();
}
function closeForm() { $("ov-form").classList.remove("open"); if (formFocus) formFocus.focus(); }

async function saveForm() {
  const fields = {};
  for (const c of CHAMPS) {
    if (c.t === "ro" || c.t === "calc") continue;   // REF et Montant_HT (formule) non envoyés
    const el = $("f_" + c.k);
    if (c.t === "bool") fields[c.k] = el.classList.contains("on");
    else if (c.t === "eur") fields[c.k] = el.value === "" ? null : Number(el.value);
    else if (c.t === "pct") fields[c.k] = el.value === "" ? null : Number((Number(el.value) / 100).toFixed(6));
    else if (c.t === "date") { const m = el.value.split("-").map(Number); fields[c.k] = el.value ? Date.UTC(m[0], m[1] - 1, m[2]) / 1000 : null; }
    else fields[c.k] = el.value;
  }
  $("form-save").disabled = true; $("form-msg").textContent = "Enregistrement…";
  try {
    await grist.docApi.applyUserActions([["UpdateRecord", "Locaux", locSel, fields]]);
    closeForm();
    await loadLocaux();
  } catch (e) { $("form-msg").textContent = "Erreur : " + (e.message || e); }
  finally { $("form-save").disabled = false; }
}
$("loc-edit").onclick = openForm;
$("form-cancel").onclick = closeForm;
$("form-save").onclick = saveForm;
$("ov-form").addEventListener("click", e => { if (e.target === $("ov-form")) closeForm(); });
$("form-grid").addEventListener("input", e => {
  if (!["f_Montant_loyer", "f_Provision_TF", "f_Provision_charges"].includes(e.target.id)) return;
  const v = k => Number($("f_" + k).value) || 0;
  $("f_Montant_HT").value = (Math.round((v("Montant_loyer") + v("Provision_TF") + v("Provision_charges")) * 100) / 100).toFixed(2);
});
$("form-grid").addEventListener("click", e => {
  const b = e.target.closest("button.switch"); if (!b) return;
  const on = b.classList.toggle("on"); b.setAttribute("aria-checked", on);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("ov-form").classList.contains("open")) closeForm(); });

// ---------- Nouvelle facture ----------
const pad2 = n => String(n).padStart(2, "0");
const factureLabel = (dateStr, num) => {      // même logique que la formule de $Num_Facture
  if (!dateStr) return "";
  const [y, m] = dateStr.split("-");
  return "FA" + y.slice(-2) + "-" + m + "-" + String(Math.trunc(Number(num) || 0)).padStart(3, "0");
};
let newLines = [], newFocus = null;

function refreshNewHeader() {
  const f = factureLabel($("n_date").value, $("n_num").value);
  $("n_fact").value = f;
  const opt = $("n_ref").selectedOptions[0], ref = opt && opt.value ? opt.textContent : "";
  document.querySelectorAll("#new-rows .c-ref").forEach(td => td.textContent = ref);
  document.querySelectorAll("#new-rows .c-fact").forEach(td => td.textContent = f);
}
function renderNewLines() {
  $("new-rows").innerHTML = newLines.map((l, i) =>
    `<tr data-i="${i}"><td class="ro c-ref"></td><td class="ro c-fact"></td>
     <td><input data-f="d" type="text" aria-label="Description" value="${esc2(l.d)}"></td>
     <td><input data-f="m" class="num" type="number" step="0.01" aria-label="Montant" value="${esc2(l.m)}"></td>
     <td><button type="button" data-del="${i}" aria-label="Supprimer la ligne" title="Supprimer la ligne">✕</button></td></tr>`).join("");
  refreshNewHeader();
}
async function openNew() {
  newFocus = document.activeElement;
  const t = new Date();
  $("n_date").value = `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
  $("n_num").value = data.reduce((m, r) => Math.max(m, r.n), 0) + 1;
  $("n_ref").innerHTML = '<option value="">Sélectionner…</option>';
  $("new-msg").textContent = "";
  newLines = [{ d: "", m: "" }];
  renderNewLines();
  $("ov-new").classList.add("open"); $("n_ref").focus();
  try {
    const lt = await grist.docApi.fetchTable("Locaux");
    const idx = lt.id.map((_, i) => i).sort((a, b) => String(lt.REF[a] ?? "").localeCompare(String(lt.REF[b] ?? ""), "fr", { numeric: true }));
    $("n_ref").innerHTML = '<option value="">Sélectionner…</option>' + idx.map(i => `<option value="${lt.id[i]}">${esc2(lt.REF[i] ?? "")}</option>`).join("");
  } catch (e) { $("new-msg").textContent = "Erreur : " + (e.message || e); }
}
function closeNew() { $("ov-new").classList.remove("open"); if (newFocus) newFocus.focus(); }

async function saveNew() {
  const msg = t => { $("new-msg").textContent = t; };
  const opt = $("n_ref").selectedOptions[0];
  if (!opt || !opt.value) return msg("Sélectionnez une référence.");
  if (!$("n_date").value) return msg("Saisissez la date de facture.");
  if ($("n_num").value === "") return msg("Saisissez le numéro de facture.");
  const [y, m, d] = $("n_date").value.split("-").map(Number);
  // Si Factures.REF est une colonne Référence (valeurs numériques), on envoie l'id du local, sinon son texte
  const refIsRef = data.length === 0 || data.some(r => typeof r.refRaw === "number");
  const lines = newLines.filter(l => l.d.trim() !== "" || l.m !== "");
  $("new-save").disabled = true; msg("Enregistrement…");
  let id;
  try {
    const res = await grist.docApi.applyUserActions([["AddRecord", "Factures", null,
      { REF: refIsRef ? +opt.value : opt.textContent, Date_Facture: Date.UTC(y, m - 1, d) / 1000, Num: Number($("n_num").value) }]]);
    id = res.retValues[0];
  } catch (e) { msg("Erreur : " + (e.message || e)); $("new-save").disabled = false; return; }
  try {
    if (lines.length) await grist.docApi.applyUserActions([["BulkAddRecord", "Lignes_de_facture", lines.map(() => null), {
      Num_Facture: lines.map(() => id),
      Description: lines.map(l => l.d),
      Montant: lines.map(l => l.m === "" ? null : Number(l.m))
    }]]);
    closeNew();
  } catch (e) { msg("Facture créée, mais erreur sur les lignes : " + (e.message || e)); }
  finally { $("new-save").disabled = false; }
}
$("btnNew").onclick = openNew;
$("new-cancel").onclick = closeNew;
$("new-save").onclick = saveNew;
$("new-add").onclick = () => { newLines.push({ d: "", m: "" }); renderNewLines(); const r = $("new-rows").lastElementChild; if (r) r.querySelector("input").focus(); };
$("n_ref").onchange = $("n_date").oninput = $("n_num").oninput = refreshNewHeader;
$("new-rows").addEventListener("input", e => {
  const tr = e.target.closest("tr[data-i]"); if (tr && e.target.dataset.f) newLines[+tr.dataset.i][e.target.dataset.f] = e.target.value;
});
$("new-rows").addEventListener("click", e => {
  const b = e.target.closest("button[data-del]"); if (!b) return;
  newLines.splice(+b.dataset.del, 1);
  if (!newLines.length) newLines.push({ d: "", m: "" });
  renderNewLines();
});
$("ov-new").addEventListener("click", e => { if (e.target === $("ov-new")) closeNew(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("ov-new").classList.contains("open")) closeNew(); });

function render() {
  const rf = $("ref").value, y = $("year").value, mo = $("month").value;
  const rows = data
    .filter(r => (!rf || String(r.ref) === rf) &&
                 (!y || (r.d && r.d.getUTCFullYear() == y)) &&
                 (mo === "" || (r.d && r.d.getUTCMonth() == mo)))
    .sort((a, b) => ((a.d?.getTime() ?? 0) - (b.d?.getTime() ?? 0)) * (desc ? -1 : 1) ||
                    String(a.num).localeCompare(String(b.num)) * (desc ? -1 : 1));
  $("arrow").textContent = desc ? "▼" : "▲";
  document.querySelector("th[aria-sort]").setAttribute("aria-sort", desc ? "descending" : "ascending");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  $("rows").innerHTML = rows.length
    ? rows.map(r => `<tr data-id="${r.id}" tabindex="0" class="${r.id === selectedId ? "sel" : ""}"><td>${esc(r.ref)}</td><td>${r.d ? fmtDate.format(r.d) : ""}</td><td>${esc(r.num)}</td><td class="num">${euro.format(r.montant)}</td></tr>`).join("")
    : '<tr><td colspan="4" class="empty">Aucune facture pour cette période.</td></tr>';
}
</script>
</body>
</html>
